<!DOCTYPE html>
<html lang="fr" dir="ltr">
  <head>
    <title>Key forge</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="app.css">
    <link rel="shortcut icon" href="favicon.png">
    <script src="app.js" defer></script>
  </head>

  <body>

    <article>
        <h1>The key forge</h1>
        <p>You can generate a password </p>
    </article>
    <article>
        <h2 id="clave">Your future password here</h2>
        <label>Choose the password's length (4-32) : </label>
        <input type="number" id="lengthInput" min="4" max="32" value="5">
        <label>Digits : </label>
        <input type="checkbox" id="digitInput"/>
        <label>Symbols : </label>
        <input type="checkbox" id="symbolInput"/>
        <button id="generateBtn">Generate</button>
    </article>

  </body>
</html>
